<svg aria-label="Azobenzene switches shape under light" role="img" viewBox="0 0 1600 900" height="900" width="1600" xmlns="http://www.w3.org/2000/svg"><title>Azobenzene switches shape under light</title><desc>Ultraviolet light favors formation of (Z)-azobenzene from the (E) isomer. Thermal relaxation returns the molecule to the (E) isomer.</desc><rect fill="#15213A" height="900" width="1600"/><text fill="#F7F6FC" text-anchor="start" font-weight="400" font-family="Georgia, Bitstream Charter, serif" font-size="69" y="140" x="77">Azobenzene switches shape under light</text><text fill="#BCC8E1" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif" font-size="26" y="199" x="80">Light changes the relative positions of the phenyl groups around the N=N bond.</text><path stroke-width="1" stroke="#53627E" d="M 79 244 H 1521"/><g id="isomer-0"><rect stroke="#415473" fill="#1D2C48" rx="14" height="458" width="562" y="286" x="79"/><g transform="translate(267.9716383246383 603.4195328874921) scale(1.6)" data-renderer="SmilesDrawer 2.4.2" data-smiles="C1=CC=CC=C1/[N:1]=[N:2]/C1=CC=CC=C1" id="azobenzene-0"><defs><radialGradient r="30" cy="-73.92299110533588" cx="43.92313585530805" gradientUnits="userSpaceOnUse" id="azobenzene-0-ref-1"><stop stop-color="#A9D8FF" offset="20%"/><stop stop-color="#eff5fa" offset="80%"/></radialGradient><radialGradient r="30" cy="-86.60153895755685" cx="71.11236946640754" gradientUnits="userSpaceOnUse" id="azobenzene-0-ref-2"><stop stop-color="#A9D8FF" offset="20%"/><stop stop-color="#eff5fa" offset="80%"/></radialGradient></defs><mask height="153.62242034893688" width="217.56589292046402" y="-157.07341822915097" x="-51.265220413130976" maskUnits="userSpaceOnUse" id="azobenzene-0-ref-3"><rect fill="white" height="153.62242034893688" width="217.56589292046402" y="-157.07341822915097" x="-51.265220413130976"/><circle fill="black" r="9.75" cy="-73.92299110533588" cx="43.92313585530805"/><circle fill="black" r="9.75" cy="-86.60153