<svg aria-label="From molecule to prediction" role="img" viewBox="0 0 1600 900" height="900" width="1600" xmlns="http://www.w3.org/2000/svg"><title>From molecule to prediction</title><desc>A molecular property workflow. Draw paracetamol, convert atoms and bonds to a graph, pass messages and pool the resulting atom states, then read out a model estimate of aqueous solubility.</desc><rect fill="#F4F7FB" height="900" width="1600"/><text fill="#142942" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif" font-size="74" y="126" x="66">From molecule to prediction</text><text fill="#4B6179" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif" font-size="27" y="179" x="70">How a graph neural network uses atoms and bonds to estimate a molecular property.</text><path stroke="#C9D7E5" d="M 68 220 H 1532"/><g data-stage="Molecule"><rect stroke="#C9D7E5" fill="#FFFFFF" rx="14" height="459" width="316" y="261" x="68"/><text fill="#142942" text-anchor="start" font-weight="700" font-family="Arial, Helvetica, sans-serif" font-size="29" y="310" x="92">Molecule</text><text fill="#4B6179" text-anchor="start" font-weight="400" font-family="Arial, Helvetica, sans-serif" font-size="20" y="347" x="92">Paracetamol</text><g transform="translate(-173.59994962752484 476.29358953614593) scale(1.44)" data-renderer="SmilesDrawer 2.4.2" data-smiles="C[C:1](=[O:2])[NH:3]C1=CC=C(O)C=C1" id="paracetamol"><defs><radialGradient r="30" cy="25.9809438788874" cx="224.9999650191144" gradientUnits="userSpaceOnUse" id="paracetamol-ref-1"><stop stop-color="#A33864" offset="20%"/><stop stop-color="#14181e" offset="80%"/></radialGradient><radialGradient r="30" cy="51.961705992420576" cx="269.9999650191144" gradientUnits="userSpaceOnUse" id="paracetamol-ref-2"><stop stop-color="#285AA8" offset="20%"/><stop stop-color="#14181e" offset="80%"/></radialGradient><radialGradient r="30" cy="-51.961342461711965" cx="329.9999650191146" gradientUnits="userSpaceOnUse"